name: Deploy to Google Play                                           
                                                                      
on:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
  workflow_dispatch:                                                  
    inputs:                                                           
      track:                                                          
        description: 'Track de publicação'                            
        required: true                                                
        default: 'internal'                                           
        type: choice                                                  
        options:                                                      
          - internal                                                  
          - alpha                                                     
                                                                      
jobs:                                                                 
  build-and-deploy:                                                   
    name: Build & Deploy (${{ github.event.inputs.track || 'internal' }})           
    runs-on: ubuntu-latest
    steps:
      # ── Checkout ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Java ────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter ─────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      # ── Firebase config ─────────────────────────────────
      - name: Restore google-services.json
        run: |
          mkdir -p mobile_app/android/app
          cat > mobile_app/android/app/google-services.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Restore firebase_options.dart
        run: |
          cat > mobile_app/lib/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      # ── Keystore ────────────────────────────────────────
      - name: Create keystore directory
        run: mkdir -p mobile_app/android/app/keystore

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > mobile_app/android/app/keystore/pulso-release.jks

      - name: Create key.properties
        run: |
          cat > mobile_app/android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=pulso
          storeFile=app/keystore/pulso-release.jks
          EOF

      # ── Semantic Versioning ──────────────────────────────
      - name: Determine version bump (semantic versioning)
        id: version
        run: |
          # Get current version from pubspec.yaml
          current=$(grep "^version:" mobile_app/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          IFS='.' read -r major minor patch <<< "$current"

          # Get last tag or use first commit
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Analyze commits since last tag
          if [ -z "$last_tag" ]; then
            commits=$(git log --oneline)
          else
            commits=$(git log ${last_tag}..HEAD --oneline)
          fi

          # Determine bump type (BREAKING > BREAKING CHANGE > feat > fix)
          has_breaking=$(echo "$commits" | grep -E "^[a-f0-9]+ (BREAKING|feat!|chore!)" | wc -l)
          has_feature=$(echo "$commits" | grep -E "^[a-f0-9]+ feat:" | wc -l)
          has_fix=$(echo "$commits" | grep -E "^[a-f0-9]+ fix:" | wc -l)

          # Calculate new version
          if [ "$has_breaking" -gt 0 ]; then
            major=$((major + 1))
            minor=0
            patch=0
            bump_type="MAJOR"
          elif [ "$has_feature" -gt 0 ]; then
            minor=$((minor + 1))
            patch=0
            bump_type="MINOR"
          elif [ "$has_fix" -gt 0 ]; then
            patch=$((patch + 1))
            bump_type="PATCH"
          else
            patch=$((patch + 1))
            bump_type="PATCH (no conventional commits)"
          fi

          new_version="${major}.${minor}.${patch}"

          # Increment build number
          current_build=$(grep "^version:" mobile_app/pubspec.yaml | cut -d'+' -f2)
          new_build=$((current_build + 1))

          new_version_full="${new_version}+${new_build}"

          echo "Current version: ${current}+${current_build}"
          echo "New version: ${new_version_full} (bump: ${bump_type})"
          echo "new_version=${new_version_full}" >> $GITHUB_OUTPUT
          echo "bump_type=${bump_type}" >> $GITHUB_OUTPUT

      - name: Update pubspec.yaml with new version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.new_version }}/" mobile_app/pubspec.yaml
          echo "Updated pubspec.yaml to version: ${{ steps.version.outputs.new_version }}"

      - name: Commit and push version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mobile_app/pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} (${{ steps.version.outputs.bump_type }}) [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create git tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      # ── Build ────────────────────────────────────────────
      - name: Clean Flutter cache
        working-directory: mobile_app
        run: flutter clean

      - name: Repair pub cache
        run: flutter pub cache repair

      - name: Flutter pub get
        working-directory: mobile_app
        run: flutter pub get --no-precompile

      - name: Build AAB
        working-directory: mobile_app
        run: flutter build appbundle --release

      # ── Upload to Play Store ─────────────────────────────
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.pulsofit
          releaseFiles: mobile_app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

