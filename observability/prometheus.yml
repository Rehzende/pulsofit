global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # OTEL Collector self-metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  # Metrics exported by services via OTEL Collector (Prometheus exporter)
  - job_name: "pulso-services"
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # Keep service_name label for filtering by service
      - source_labels: [service_name]
        target_label: service
